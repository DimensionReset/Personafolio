<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>PERSONA</title>

        <link rel="icon" type="image/png" href="images/favicon.png" />

        <style>
            /* === CUSTOM FONTS ===*/

            /* New Rodin */
            @font-face {
                font-family: "Fontworks New Rodin";
                src: url("fonts/NewRodinProL.otf") format("opentype");
                font-weight: 300;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Fontworks New Rodin";
                src: url("fonts/NewRodinProDB.otf") format("opentype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Fontworks New Rodin";
                src: url("fonts/NewRodinProB.otf") format("opentype");
                font-weight: 600;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Fontworks New Rodin";
                src: url("fonts/NewRodinProEB.otf") format("opentype");
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }

            /* Rodin */
            @font-face {
                font-family: "Fontworks Rodin";
                src: url("fonts/RodinProB.otf") format("opentype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Fontworks Rodin";
                src: url("fonts/RodinProDB.otf") format("opentype");
                font-weight: 600;
                font-style: normal;
                font-display: swap;
            }

            @font-face {
                font-family: "Fontworks Rodin";
                src: url("fonts/RodinProUB.otf") format("opentype");
                font-weight: 700;
                font-style: normal;
                font-display: swap;
            }

            /* Skip STD B */
            @font-face {
                font-family: "Skip STD B";
                src: url("fonts/SkipSTDB.otf") format("opentype");
                font-weight: 400;
                font-style: normal;
                font-display: swap;
            }

            /* === MAIN ===*/
            body {
                font-family:
                    "Fontworks Rodin",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    Roboto,
                    Helvetica,
                    Arial,
                    sans-serif;
                font-weight: 400;
                font-style: normal;
            }

            /* === ANIMATIONS === */

            /* text growth animations*/
            ul li span {
                transition: transform 0.1s cubic-bezier(0.25, 1, 0.5, 1);
            }

            ul li:has(span.text-black) {
                z-index: 3 !important;
            }

            ul li span.text-black {
                transform: scale(1.2);
            }

            #optionsList span {
                display: inline-block;
            }

            #optionsList span:not([class="text-black"]) {
                /* for the wavy effect on text */
                filter: url(#wavy);
            }

            .cursor-triangle-svg {
                /* for the transition between selections */
                position: fixed !important;
                transition:
                    transform 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                    top 0.3s cubic-bezier(0.25, 1, 0.5, 1),
                    left 0.3s cubic-bezier(0.25, 1, 0.5, 1);
                transform-origin: left center;
                pointer-events: none;
            }

            @keyframes heartbeat {
                /* for the red triangle svg's heartbeat effect thingy */
                0% {
                    scale: 1;
                }
                15% {
                    scale: 1.015;
                }
                60% {
                    scale: 1;
                }
            }

            .animate-heartbeat {
                /* keyframes for above */
                animation: heartbeat 1s cubic-bezier(0.4, 0, 0.6, 1) infinite;
                transform-origin: center left;
            }
        </style>

        <script
            type="module"
            src="https://pyscript.net/releases/2026.7.2/core.js"
        ></script>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <!-- AUDIO FILES -->
        <!-- Music -->
        <audio id="colorYourNightMUS" loop onloadeddata="this.volume = 0.25">
            <source src="sound/music/ColorYourNight.mp3" type="audio/mp3" />
        </audio>

        <!-- SFX -->
        <audio id="uiSliderSFX" onloadeddata="this.volume = 0.25">
            <source src="sound/sfx/ui_slider.wav" type="audio/wav" />
        </audio>

        <audio id="launchSFX" onloadeddata="this.volume = 0.25">
            <source src="sound/sfx/launch_game.wav" type="audio/wav" />
        </audio>

        <audio id="activationSFX" onloadeddata="this.volume = 0.25">
            <source src="sound/sfx/activation.wav" type="audio/wav" />
        </audio>

        <audio id="hideSFX" onloadeddata="this.volume = 0.25">
            <source src="sound/sfx/hide.wav" type="audio/wav" />
        </audio>

        <!-- Wave Filter Definition -->
        <svg width="100%" height="100%" style="display: none">
            <!-- https://dev.to/codingdudecom/css-wavy-text-generator-3o2o -->
            <!-- my GOAT <3 -->

            <defs>
                <filter id="wavy" filterUnits="userSpaceOnUse" x="0" y="0">
                    <feTurbulence
                        id="wave-animation"
                        numOctaves="1"
                        seed="1"
                        baseFrequency="0 0.0645034"
                    ></feTurbulence>
                    <feDisplacementMap
                        scale="5"
                        in="SourceGraphic"
                    ></feDisplacementMap>
                </filter>
                <animate
                    xlink:href="#wave-animation"
                    attributeName="baseFrequency"
                    dur="1s"
                    keyTimes="0;0.5;1"
                    values="0.0 0.04;0.0 0.07;0.0 0.04"
                    repeatCount="indefinite"
                ></animate>
            </defs>
        </svg>

        <!-- MAIN -->
        <div
            class="relative h-screen w-full overflow-hidden flex items-center justify-center select-none"
        >
            <video
                id="mainBgVid"
                autoplay
                muted
                loop
                playsinline
                class="absolute inset-0 w-full h-full object-cover -z-10"
            >
                <source src="videos/loading-bg.mp4" type="video/mp4" />
                Your browser does not support the video tag.
            </video>

            <!--[=== LOADING SCREEN ===]-->
            <div
                id="loadingMenu"
                class="fixed z-5 text-left w-full flex flex-col"
            >
                <div class="w-full flex flex-row">
                    <div class="w-10 self-stretch"></div>
                    <p class="font-semibold text-xl lg:text-2xl text-white">
                        ICT Portfolio
                    </p>
                </div>

                <div
                    class="w-full flex flex-row text-black/7.5 font-semibold [text-stroke:0.04rem_white] [-webkit-text-stroke:0.04rem_white] text-8xl lg:text-9xl"
                    id="loadingMenu"
                >
                    <div class="bg-blue-800 w-10 self-stretch"></div>
                    <div>
                        <h1>PRESS<br />ANY<br />BUTTON</h1>
                    </div>
                </div>
            </div>

            <!--[=== ALL PAGE SCREENS ===]-->
            <div id="sceneContainer" class="fixed w-full h-full">
                <!-- MEET THE CREATOR -->
                <!--
                    hey me pls add back "hidden" class
                    when done editing ok ty bebe <3
                -->
                <div
                    id="creatorMenu"
                    class="hidden z-4 flex flex-row fixed text-left text-black text-7xl italic w-full h-full not-italic"
                    style="font-family: Skip STD B"
                >
                    <!-- bg -->
                    <video
                        id="sceneBgVid"
                        autoplay
                        muted
                        loop
                        playsinline
                        class="absolute inset-0 w-full h-full object-cover"
                    >
                        <source src="videos/skills-bg.mp4" type="video/mp4" />
                        Your browser does not support the video tag.
                    </video>

                    <!-- Character List -->
                    <div class="w-1/2 z-5 h-full flex flex-col justify-center">
                        <div
                            class="bg-[#afb3b6] self-stretch h-1/12 w-2/7 absolute translate-x-[18%] -translate-y-[9%] [clip-path:polygon(0_0,_100%_0,_98%_100%,_0_100%)]"
                        ></div>

                        <!-- GENESIS -->
                        <!-- Profile Picture (made in canva :D) -->
                        <div
                            class="bg-black self-stretch h-1/12 w-1/3 absolute z-10 overflow-hidden [clip-path:polygon(0_0,_100%_0,_98%_100%,_0_100%)]"
                        >
                            <img
                                src="images/auraGuy.png"
                                class="w-auto h-full object-cover pl-3"
                            />
                        </div>

                        <!-- Text Information -->
                        <div
                            class="bg-white self-stretch h-1/12 w-2/3 flex flex-row justify-center items-center relative z-10 [clip-path:polygon(25%_0%,_100%_0,_98%_100%,_25%_100%,_20%_40%)]"
                        >
                            <!-- name -->
                            <div>
                                <p class="text-lg md:text-2xl shrink-0 pl-15">
                                    Genesis
                                </p>
                            </div>

                            <!-- slashy slash slash -->
                            <div
                                class="h-12 border-l border-blue-400 -skew-x-[20deg] ml-8 mr-4 hidden md:inline-block"
                            ></div>

                            <!-- level number -->
                            <div class="h-2/5 flex items-end gap-2">
                                <p
                                    class="hidden text-xs md:text-sm md:inline-block"
                                >
                                    Lv
                                </p>
                                <p
                                    class="hidden text-base md:text-xl md:inline-block"
                                >
                                    15
                                </p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>

            <!--[=== MAIN MENU SCREEN ===]-->
            <div
                id="optionsMenu"
                class="flex flex-row hidden fixed z-1 text-left text-[#83f2f9] text-7xl italic font-bold"
            >
                <div class="w-10 self-stretch"></div>

                <ul
                    class="list-none flex flex-col leading-[0.8]"
                    id="optionsList"
                >
                    <!-- DO NOT REMOVE THE SPANS -->

                    <li>
                        <span>CREATOR</span>
                    </li>
                    <li>
                        <span>CLUB</span>
                    </li>
                    <li>
                        <span>CHECKER</span>
                    </li>
                    <li>
                        <span>SUPPORT</span>
                    </li>
                </ul>
            </div>
        </div>

        <!--[=== LITERALLY ALL OF THE CODE ===]-->
        <script type="py">
            print("Loaded!")

            # === LIBRARIES ===
            import random
            from js import document, window
            from pyodide.ffi import create_proxy

            # === CONFIG ===
            BASE_UNIT_WIDTH = 100

            # === HELPER FUNCTIONS ===

            def playSound(name, vol=None):
                snd = document.getElementById(name)
                if not snd:
                    return

                snd_clone = snd.cloneNode(True)
                if vol:
                    snd_clone.volume = vol

                def on_ended(event):
                    snd_clone.remove()
                    ended_proxy.destroy()

                ended_proxy = create_proxy(on_ended)
                snd_clone.addEventListener("ended", ended_proxy)

                snd_clone.play()

            # Cursor SVG Container
            svg_ns = "http://www.w3.org/2000/svg"
            svg_container = document.createElement("div")
            svg_container.id = "global-cursor-container"
            svg_container.classList.add("hidden")
            document.body.appendChild(svg_container)

            # Helper to create template triangle SVGs (used for selection cursors)
            def create_base_svg(poly_id, fill_color, extra_class="", y_offset=0, x_offset=0):
                svg = document.createElementNS(svg_ns, "svg")
                svg.setAttribute("width", "400")
                svg.setAttribute("height", "200")
                svg.setAttribute("viewBox", "0 0 400 200")
                svg.setAttribute("class", f"overflow-visible fixed mix-blend-plus-lighter cursor-triangle-svg {extra_class}")

                poly = document.createElementNS(svg_ns, "polygon")
                poly.setAttribute("id", poly_id)
                poly.setAttribute("points", f"{BASE_UNIT_WIDTH + x_offset},{-20 + y_offset} {BASE_UNIT_WIDTH + x_offset},{60 + y_offset} 0,{105 - y_offset}")
                poly.setAttribute("fill", fill_color)

                svg.appendChild(poly)
                svg_container.appendChild(svg)

                return svg

            # cursor triangle set-up
            y_rand = random.uniform(-3, 7)
            svg_front = create_base_svg("triangleFront", "rgb(255, 0, 0)", x_offset=2.5, y_offset=y_rand, extra_class="animate-heartbeat") # matches back half
            svg_red = create_base_svg("triangleRed", "rgb(255, 0, 0)", extra_class="z-1") # makes text red
            svg_back = create_base_svg("triangleBack", "rgb(255, 255, 255)", extra_class="-z-1") # matches front half

            # CURSOR HANDLING
            current_selected_span = None

            # Helper to hide all scenes and load the options menu
            def load_options():
                options_menu = document.getElementById("optionsMenu")
                all_scenes = document.querySelectorAll('div#sceneContainer div[id$="Menu"]')

                for scene in all_scenes:
                    scene.classList.add("hidden")

                if options_menu:
                    options_menu.classList.remove("hidden")
                    svg_container.classList.remove("hidden")

            # Event logic for when Backspace key is pressed
            escape_press_proxy = None # for event cleaning

            def exit_scene(event):
                global escape_press_proxy

                if event.code == "Backspace" or event.code == "KeyC":
                    playSound("hideSFX")
                    load_options()
                    if escape_press_proxy:
                        window.removeEventListener("keydown", escape_press_proxy)
                        escape_press_proxy.destroy()
                        escape_press_proxy = None

            # Helper to load different scenes by removing their "hidden" class
            def load_scene(name):
                global escape_press_proxy

                name = str(name).lower()
                sceneContainer = document.getElementById(f"{name}Menu")

                if not sceneContainer:
                    return

                options_menu = document.getElementById("optionsMenu")
                all_scenes = document.querySelectorAll('div#sceneContainer div[id$="Menu"]')

                if options_menu:
                    options_menu.classList.add("hidden")
                    svg_container.classList.add("hidden")

                for scene in all_scenes:
                    scene.classList.add("hidden")

                sceneContainer.classList.remove("hidden")

                if escape_press_proxy:
                    window.removeEventListener("keydown", escape_press_proxy)
                    escape_press_proxy.destroy()

                escape_press_proxy = create_proxy(exit_scene)
                window.addEventListener("keydown", escape_press_proxy)

            # Event logic for when cycling through <li> with arrows or WASD
            def option_select_arrow(event):
                if document.getElementById("optionsMenu").classList.contains("hidden"):
                    return

                svg_container.className = ""
                global current_selected_span

                last_selected_text = document.querySelector("#optionsList li span.text-black")
                current_selected_span = document.querySelector("#optionsList > li > span")

                if last_selected_text:
                    current_li = last_selected_text.closest("li")

                    if event.code == "KeyW" or event.code == "ArrowUp":
                        if not current_li.previousElementSibling:
                            next_li = document.querySelector("#optionsList > li:last-child")
                        else:
                            next_li = current_li.previousElementSibling
                    elif event.code == "KeyS" or event.code == "ArrowDown":
                        if not current_li.nextElementSibling:
                            next_li = document.querySelector("#optionsList > li")
                        else:
                            next_li = current_li.nextElementSibling
                    elif event.code == "Space":
                        playSound("activationSFX")
                        load_scene(last_selected_text.innerHTML)
                        return
                    else:
                        return

                    if next_li:
                        target_span = next_li.querySelector("span")
                        if target_span:
                            last_selected_text.classList.remove("text-black")
                            current_selected_span = target_span
                    else:
                        current_selected_span = last_selected_text.closest("span")

                if current_selected_span:
                    current_selected_span.classList.add("text-black")
                    playSound("uiSliderSFX")
                    update_cursor_position()

            # Event logic for when <li> is clicked
            def option_select_mouse(event):
                if document.getElementById("optionsMenu").classList.contains("hidden"):
                    return

                svg_container.className = ""
                global current_selected_span
                last_selected_text = document.querySelector("#optionsList li span.text-black")
                clicked_item_text = event.target.closest("span")

                if not clicked_item_text:
                    return

                if last_selected_text:
                    if clicked_item_text == last_selected_text:
                        playSound("activationSFX")
                        load_scene(clicked_item_text.innerHTML)
                        return

                    last_selected_text.classList.remove("text-black")

                clicked_item_text.classList.add("text-black")

                current_selected_span = clicked_item_text
                playSound("uiSliderSFX")
                update_cursor_position()

            # Helper to update cursor pos after event and option select
            def update_cursor_position(event=None):
                global current_selected_span
                if not current_selected_span:
                    return

                rect = current_selected_span.getBoundingClientRect()
                text_width = rect.width
                scale_x = text_width / BASE_UNIT_WIDTH

                is_resize = event is not None

                for svg in [svg_front, svg_red, svg_back]:
                    if is_resize:
                        svg.style.transition = "none"
                    else:
                        svg.style.transition = "transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), top 0.3s cubic-bezier(0.25, 1, 0.5, 1), left 0.3s cubic-bezier(0.25, 1, 0.5, 1)"

                    svg.style.top = f"{rect.top + 3}px"
                    svg.style.left = f"{rect.left}px"
                    svg.style.transform = f"scaleX({scale_x})"

            # check for viewport resizing
            resize_proxy = create_proxy(update_cursor_position)
            window.addEventListener("resize", resize_proxy)

            # Event logic for exiting loading screen on keypress
            def handle_loading_exit(event):
                # menus
                main_bg_vid = document.getElementById("mainBgVid")
                loading_menu = document.getElementById("loadingMenu")
                options_menu = document.getElementById("optionsMenu")

                # remove prev scene here
                if loading_menu:
                    loading_menu.classList.add("hidden")
                    playSound("launchSFX")

                # load scene
                if options_menu:
                    playSound("colorYourNightMUS")
                    options_menu.classList.remove("hidden")
                    main_bg_vid.src = "videos/main-bg.mp4"

                    list_items = document.querySelectorAll("#optionsList li")
                    depth = 1

                    for item in list_items:
                        random_offset = random.uniform(-12, -9)

                        if depth == 1:
                            item.classList.add("z-3")
                        elif depth == 2:
                            item.classList.add("z-2", "text-[#3bc5fc]")
                        else:
                            item.classList.add("z-1", "text-[#5fccfa]")
                            depth = 0

                        depth += 1

                        # check for item click for cursor shi
                        click_proxy = create_proxy(option_select_mouse)
                        item.addEventListener("click", click_proxy)

                        item.classList.add(f"-my-{(random_offset/10)*-1}", "cursor-pointer", "inline-block", "relative")
                        item.style.transform = f"rotate({random_offset}deg)"

                # event cleanup
                window.removeEventListener("keydown", loading_proxy)
                loading_proxy.destroy()

            # check for keypress
            arrow_proxy = create_proxy(option_select_arrow)
            window.addEventListener("keydown", arrow_proxy)

            # same but for loading
            loading_proxy = create_proxy(handle_loading_exit)
            window.addEventListener("keydown", loading_proxy)
        </script>
    </body>
</html>
